<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>かきじゅん 〜 漢字の書き順学習</title>
<link rel="icon" href="icon-kan.png" type="image/png">
<link rel="apple-touch-icon" href="icon-kan.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="header-titles">
      <span class="title-jp">かきじゅん</span>
      <span class="subtitle">小学生の漢字</span>
       <span class="credit">
    書き順データ: <a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a>
    (© Ulrich Apel, CC BY-SA 3.0)
  </span>
    </div>
    <button class="settings-btn" id="btn-open-settings" aria-label="設定">⚙</button>
  </header>

  <!-- ============ 一覧ページ ============ -->
  <section id="view-list">
    <div class="grade-select-row">
      <label for="grade-select" class="grade-select-label">学年</label>
      <select id="grade-select"></select>
    </div>
    <div class="kanji-grid" id="kanji-grid"></div>
  </section>

  <!-- ============ 設定ページ ============ -->
  <section id="view-settings" class="hidden">
    <div class="detail-top">
      <button class="back-btn" id="btn-settings-back">← もどる</button>
    </div>
    <h2 class="settings-title">設定</h2>

    <div class="settings-group">
      <h3 class="settings-label">現在の学年</h3>
      <select id="setting-current-grade"></select>
    </div>

    <div class="settings-group">
      <h3 class="settings-label">漢字の練習モード</h3>
      <label class="settings-radio-row">
        <input type="radio" name="practice-mode-type" value="belowGrade">
        設定した学年より下を直接練習
      </label>
      <label class="settings-radio-row">
        <input type="radio" name="practice-mode-type" value="all">
        すべて直接練習
      </label>
      <label class="settings-radio-row">
        <input type="radio" name="practice-mode-type" value="perGrade">
        学年ごとに設定
      </label>
      <div class="settings-per-grade hidden" id="settings-per-grade">
        <label class="settings-checkbox-row"><input type="checkbox" data-grade="1"> 小学1年生</label>
        <label class="settings-checkbox-row"><input type="checkbox" data-grade="2"> 小学2年生</label>
        <label class="settings-checkbox-row"><input type="checkbox" data-grade="3"> 小学3年生</label>
        <label class="settings-checkbox-row"><input type="checkbox" data-grade="4"> 小学4年生</label>
        <label class="settings-checkbox-row"><input type="checkbox" data-grade="5"> 小学5年生</label>
        <label class="settings-checkbox-row"><input type="checkbox" data-grade="6"> 小学6年生</label>
      </div>
    </div>

    <div class="settings-group">
      <h3 class="settings-label">書き順見本の位置</h3>
      <label class="settings-radio-row">
        <input type="radio" name="sample-position" value="left">左
      </label>
      <label class="settings-radio-row">
        <input type="radio" name="sample-position" value="right">右
      </label>
    </div>

    <div class="settings-group">
      <h3 class="settings-label">なぞり判定の厳しさ</h3>
      <label class="settings-radio-row">
        <input type="radio" name="tolerance" value="easy">やさしい
      </label>
      <label class="settings-radio-row">
        <input type="radio" name="tolerance" value="normal">ふつう
      </label>
      <label class="settings-radio-row">
        <input type="radio" name="tolerance" value="hard">きびしい
      </label>
    </div>

    <div class="settings-group">
      <h3 class="settings-label">書き直し方法</h3>
      <label class="settings-radio-row">
        <input type="radio" name="redo-mode" value="strokeOnly">その1画だけ書き直す
      </label>
      <label class="settings-radio-row">
        <input type="radio" name="redo-mode" value="fromStart">すべて最初から書き直す
      </label>
    </div>
  </section>

  <!-- ============ 直接練習ページ ============ -->
  <section id="view-practice" class="hidden">
    <div class="detail-top">
      <button class="back-btn" id="btn-practice-back">← もどる</button>
    </div>

    <div class="practice-status-line" id="practice-instruction"></div>

    <div class="practice-main-box-wrap">
      <div class="kanji-box box-stroke box-stroke-large practice-main-box" id="practice-write-box">
        <div class="grid-guide-css">
          <span class="grid-guide-v"></span>
          <span class="grid-guide-h"></span>
        </div>
        <svg class="stroke-svg" id="practice-write-svg" viewBox="0 0 109 109" style="touch-action:none;"></svg>
      </div>
    </div>

    <button class="practice-view-sample-btn" id="btn-view-sample">▶️ お手本を見る</button>

    <div class="practice-sample-overlay" id="practice-sample-overlay">
      <div class="practice-sample-overlay-inner">
        <button class="practice-overlay-close" id="btn-sample-overlay-close" aria-label="閉じる">×</button>
        <div class="kanji-box-wrap">
          <div class="kanji-box box-stroke" id="practice-sample-box">
            <div class="grid-guide-css">
              <span class="grid-guide-v"></span>
              <span class="grid-guide-h"></span>
            </div>
            <svg class="stroke-svg" id="practice-sample-svg" viewBox="0 0 109 109"></svg>
          </div>
        </div>
        <div class="practice-sample-overlay-buttons">
          <button class="nav-btn" id="btn-sample-replay">↩️ さいせい</button>
          <button class="nav-btn" id="btn-sample-continue">✏️ つづきをかく</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 個別ページ ============ -->
  <section id="view-detail" class="hidden">
    <div class="detail-top">
      <button class="back-btn" id="btn-back-top">← 一覧</button>
    </div>

    <div class="focus-kanji" id="focus-kanji"></div>
    <div class="play-instruction">字をタップで再生</div>

    <div class="boxes-row">
      <div class="kanji-box-wrap">
        <div class="kanji-box box-stroke box-stroke-large" id="box-stroke">
          <div class="grid-guide-css">
            <span class="grid-guide-v"></span>
            <span class="grid-guide-h"></span>
          </div>
          <svg class="stroke-svg" id="stroke-svg" viewBox="0 0 109 109"></svg>
        </div>
      </div>
    </div>

    <div class="meta-row">
      <span class="stroke-count" id="stroke-count-label"></span>
    </div>

    <div class="readings">
      <div class="reading-group">
        <h3>音読み</h3>
        <div class="reading-item" id="on-readings"></div>
      </div>
      <div class="reading-group">
        <h3>訓読み</h3>
        <div class="reading-item" id="kun-readings"></div>
      </div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="btn-prev">← 前の漢字</button>
      <button class="nav-btn" id="btn-next">次の漢字 →</button>
    </div>
    <button class="list-return" id="btn-back-bottom">リストに戻る</button>
  </section>

 
</div>

<script src="kanji-data-grade1.js"></script>
<script src="kanji-data-grade2.js"></script>
<script src="kanji-data-grade3.js"></script>
<script src="kanji-data-grade4.js"></script>
<script src="kanji-data-grade5.js"></script>
<script src="kanji-data-grade6.js"></script>
<script src="kanji-data.js"></script>
<script src="hiragana-data.js"></script>
<script src="katakana-data.js"></script>
<script src="numbers-data.js"></script>
<script src="stroke-data.js"></script>
<script src="content-registry.js"></script>
<script src="settings.js"></script>
<script src="settings-ui.js"></script>
<script src="app.js"></script>
<script src="practice.js"></script>
</body>
</html>
